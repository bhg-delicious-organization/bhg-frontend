<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>time.js 測試</h1>

  <button class="btn btn-primary" onclick="testTime()">測試時間函數</button>
  <button class="btn btn-success" onclick="testTimeOverride()">測試從後端覆蓋 TIME</button>

  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/time.js"></script>
  <script>
    function testTime() {
      const resultEl = document.getElementById('result');
      const now = getCurrentTimeNumber();

      const result = {
        '現在時間 (HHMM)': now,
        'TIME 常數': TIME,
        '是否為點餐時間': isUserOrderTime(),
        '點餐是否截止': isOrderEnded(),
        '是否為管理員設定時間': isAdminRestaurantTime(),
        '是否為評分時間': isRatingTime(),
        '點餐剩餘分鐘': getOrderTimeRemaining(),
        '評分剩餘分鐘': getRatingTimeRemaining(),
        '格式化點餐剩餘': formatTimeRemaining(getOrderTimeRemaining()),
        '格式化評分剩餘': formatTimeRemaining(getRatingTimeRemaining()),
        'TimeChecker 物件': typeof TimeChecker
      };

      resultEl.textContent = JSON.stringify(result, null, 2);
    }

    async function testTimeOverride() {
      const resultEl = document.getElementById('result');

      // 從後端取得時間限制
      const result = await callApi('getTimeLimits', {});

      if (result.success && result.limits) {
        TIME.ORDER_START = result.limits.ORDER_START;
        TIME.ORDER_END = result.limits.ORDER_END;
        TIME.ADMIN_START = result.limits.ADMIN_RESTAURANT_START;
        TIME.ADMIN_END = result.limits.ADMIN_RESTAURANT_END;
        TIME.RATING_START = result.limits.RATING_START;
        TIME.RATING_END = result.limits.RATING_END;

        resultEl.textContent = JSON.stringify({
          '後端回傳': result.limits,
          '更新後的 TIME': TIME,
          '是否為點餐時間 (重新判斷)': isUserOrderTime()
        }, null, 2);
      } else {
        resultEl.textContent = '取得失敗：' + JSON.stringify(result);
      }
    }
  </script>
</body>
</html>
