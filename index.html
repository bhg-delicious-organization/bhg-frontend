<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="大家政, 便當廠, 儲值系統, 訂餐系統">
    <meta name="description" content="校園儲值與訂餐系統">
    <meta name="author" content="gtes10301">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          media="print"
          onload="this.media='all'">
    <noscript>
      <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="https://i.ibb.co/1JJzGkTw/BHG-logo1.png" alt="BHG-logo" class="site-logo">
        </div>

        <div class="title-container">
            <h1>封測系統</h1>
            <div class="header-subtitle">儲值系統</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
            <button class="admin-btn" onclick="showAdminModal()" style="margin: 0; padding: 4px 8px; font-size: 0.8rem;">
                <i id="adminStatusIcon" class="fas fa-user-shield"></i>
                <span id="adminStatusText">管理員</span>
            </button>

            <button class="admin-btn" onclick="toggleNotifications(event)" style="margin: 0; padding: 4px 8px; font-size: 0.8rem;">
                <i id="notifyIcon" class="fas fa-bell-slash"></i>
                <span id="notifyText">通知</span>
            </button>
        </div>
    </header>

    <div id="pageContent">

        <!-- ==================== 登入 / 註冊頁面（首頁寫死） ==================== -->
        <div id="page-user-register" class="page-container active">

            <!-- ========== 登入區塊 ========== -->
            <div id="loginSection" class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </h2>
                </div>

                <p style="color: var(--gray); margin-bottom: 16px;">
                    請輸入學號和密碼登入系統
                </p>

                <div class="form-group">
                    <label class="form-label">學號</label>
                    <input type="text" id="loginStudentId" class="form-control" placeholder="請輸入6位數學號" maxlength="6" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label class="form-label">密碼</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="請輸入密碼">
                </div>

                <button class="btn btn-primary" onclick="loginFromGate(event)">
                    <i class="fas fa-sign-in-alt"></i> 登入
                </button>

                <div id="loginResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: var(--gray); margin-bottom: 12px;">還沒有帳號？</p>
                    <button class="btn btn-secondary" onclick="switchToRegister()">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </button>
                </div>
            </div>

            <!-- ========== 註冊區塊 ========== -->
            <div id="registerSection" class="card" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </h2>
                </div>

                <div class="form-group">
                    <label class="form-label">學號</label>
                    <input type="text" id="registerStudentId" class="form-control" placeholder="請輸入6位數學號" maxlength="6" inputmode="numeric">
                    <div class="form-text">範例：123456</div>
                </div>

                <div class="form-group">
                    <label class="form-label">姓名</label>
                    <input type="text" id="registerName" class="form-control" placeholder="請輸入真實姓名">
                </div>

                <div class="form-group">
                    <label class="form-label">密碼</label>
                    <input type="password" id="registerPassword" class="form-control" placeholder="請設定密碼（至少 6 位）">
                    <div class="form-text">密碼至少 6 位，註冊後可用學號和密碼登入</div>
                </div>

                <div class="message info" style="margin-bottom: 15px;">
                    <i class="fas fa-info-circle"></i> 申請成功後餘額為 0 元。
                </div>

                <button class="btn btn-success" onclick="registerUser(event)">
                    <i class="fas fa-check-circle"></i> 送出申請
                </button>

                <div id="registerResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: var(--gray); margin-bottom: 12px;">已經有帳號？</p>
                    <button class="btn btn-secondary" onclick="switchToLogin()">
                        <i class="fas fa-sign-in-alt"></i> 返回登入
                    </button>
                </div>
            </div>

        </div>

    </div>

    <button id="navToggleBtn" class="nav-toggle-btn" style="display: none;">
        <i class="fas fa-chevron-down"></i>
    </button>

    <nav class="bottom-nav user-nav" style="display: none;">
        <a href="#" class="nav-item" data-page="user-query">
            <i class="fas fa-search-dollar nav-icon"></i>
            <span>查詢</span>
        </a>
        <a href="#" class="nav-item" data-page="user-meal">
            <i class="fas fa-utensils nav-icon"></i>
            <span>訂飯</span>
        </a>
        <a href="#" class="nav-item" data-page="user-account">
            <i class="fas fa-user-circle nav-icon"></i>
            <span>帳號</span>
        </a>
        <a href="#" class="nav-item" data-page="user-system">
            <i class="fas fa-info-circle nav-icon"></i>
            <span>資訊</span>
        </a>
        <a href="#" class="nav-item" id="switchToAdminBtn" style="color: var(--success);">
            <i class="fas fa-user-shield nav-icon"></i>
            <span>管理</span>
        </a>
    </nav>

    <nav class="bottom-nav admin-nav" style="display: none;">
        <a href="#" class="nav-item" data-page="admin-restaurant">
            <i class="fas fa-store nav-icon"></i>
            <span>餐廳</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-batch-deduct">
            <i class="fas fa-shopping-cart nav-icon"></i>
            <span>扣款</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-giftcode">
            <i class="fas fa-gift nav-icon"></i>
            <span>儲值</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-query">
            <i class="fas fa-chart-line nav-icon"></i>
            <span>查詢</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-account">
            <i class="fas fa-key nav-icon"></i>
            <span>帳號</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-analytics">
            <i class="fas fa-chart-line nav-icon"></i>
            <span>統計</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-orders">
            <i class="fas fa-clipboard-list nav-icon"></i>
            <span>訂單</span>
        </a>
        <a href="#" class="nav-item" data-page="admin-users">
            <i class="fas fa-user-plus nav-icon"></i>
            <span>用戶</span>
        </a>
        <a href="#" class="nav-item" id="switchToUserBtn" style="color: var(--danger);">
            <i class="fas fa-user-shield nav-icon"></i>
            <span>管理</span>
        </a>
    </nav>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-lock"></i> 管理員登入</h3>
                <button class="close-btn" onclick="hideAdminModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="adminEmail" class="form-control" placeholder="請輸入 Email">
                </div>
                <div class="form-group">
                    <label class="form-label">密碼</label>
                    <input type="password" id="adminPassword" class="form-control" placeholder="請輸入密碼">
                </div>
                <div id="loginMessage"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideAdminModal()">取消</button>
                <button class="btn btn-primary" onclick="adminLogin(event)">
                    <i class="fas fa-sign-in-alt"></i> 登入
                </button>
            </div>
        </div>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="messageTitle"><i class="fas fa-info-circle"></i> 系統訊息</h3>
                <button class="close-btn" onclick="closeMessageModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="messageContent"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeMessageModal()">確定</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirmTitle"><i class="fas fa-exclamation-triangle"></i> 確認動作</h3>
                <button class="close-btn" onclick="confirmNo()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmContent"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="confirmYes()">確定</button>
                <button class="btn btn-secondary" onclick="confirmNo()">取消</button>
            </div>
        </div>
    </div>

    <script src="api.js" defer></script>
    <script src="js/core/supabase.js" defer></script>
    <script src="js/core/state.js" defer></script>
    <script src="js/core/ui.js" defer></script>
    <script src="js/core/time.js" defer></script>
    <script src="js/core/common.js" defer></script>
    <script src="js/core/navigation.js" defer></script>
    <script src="js/core/preload.js" defer></script>
    <script src="js/core/core.js" defer></script>

    <script src="js/user/query.js" defer></script>
    <script src="js/user/register.js" defer></script>
    <script src="js/user/changepwd.js" defer></script>
    <script src="js/user/account.js" defer></script>
    <script src="js/user/meal.js" defer></script>
    <script src="js/user/meal-order.js" defer></script>

    <script src="js/admin/auth.js" defer></script>
    <script src="js/admin/restaurant.js" defer></script>
    <script src="js/admin/recharge.js" defer></script>
    <script src="js/admin/query.js" defer></script>
    <script src="js/admin/analytics.js" defer></script>
    <script src="js/admin/orders.js" defer></script>
    <script src="js/admin/users.js" defer></script>
    <script src="js/admin/deduct.js" defer></script>

    <script src="js/shared/notify.js" defer></script>
    <script src="js/shared/tutorial.js" defer></script>

    <div id="tutorialOverlay" class="tutorial-overlay" style="display: none;">
        <div id="tutorialHighlight" class="tutorial-highlight"></div>
        <div class="tutorial-card">
            <div class="tutorial-card-header">
                <h3 id="tutorialTitle">新手教學</h3>
                <button class="tutorial-skip-btn" onclick="skipTutorial()">
                    <i class="fas fa-times"></i> 跳過
                </button>
            </div>
            <div class="tutorial-card-body">
                <p id="tutorialDescription">這是教學說明</p>
            </div>
            <div class="tutorial-card-footer">
                <span id="tutorialStepCounter" class="tutorial-step-counter">第 1 / 3 步</span>
                <button id="tutorialNextBtn" class="btn btn-primary" onclick="nextTutorialStep()">
                    下一步 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js', {
            scope: '/bhg-frontend/'
          })
            .then(function(registration) {
              console.log('✅ Service Worker 註冊成功');
            })
            .catch(function(error) {
              console.warn('⚠️ Service Worker 註冊失敗:', error);
            });

          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_UPDATED') {
              const { oldVersion, newVersion, isMajorUpdate } = event.data;
              console.log(`📥 更新通知: ${oldVersion || '無'} → ${newVersion}`);
              setTimeout(function() {
                const url = window.location.href.split('?')[0];
                window.location.href = url + '?_t=' + Date.now();
              }, 300);
            }
          });
        });
      }
    </script>

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "fb14b87c-e10e-4aa0-8613-0f2b05e5c937",
            safari_web_id: "web.onesignal.auto.2510e921-2066-4b3b-be25-8e0e09bd836c",
            notifyButton: { enable: false },
            serviceWorkerParam: { scope: "/bhg-frontend/onesignal/" },
            serviceWorkerPath: "/bhg-frontend/onesignal/OneSignalSDKWorker.js",
            allowLocalhostAsSecureOrigin: true,
          });
          console.log('✅ OneSignal 已初始化');
        } catch (error) {
          console.error('❌ OneSignal 初始化失敗:', error);
        }
      });
    </script>
</body>
