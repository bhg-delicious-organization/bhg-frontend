        <!-- ==================== 登入 / 註冊頁面（首頁寫死） ==================== -->
        <div id="page-user-register" class="page-container active">

            <!-- ========== 登入區塊 ========== -->
            <div id="loginSection" class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </h2>
                </div>

                <p style="color: var(--gray); margin-bottom: 16px;">
                    請輸入學號和密碼登入系統
                </p>

                <form id="loginForm" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="loginStudentId">學號</label>
                        <input 
                            type="text" 
                            id="loginStudentId" 
                            name="username"
                            class="form-control" 
                            placeholder="請輸入6位數學號" 
                            maxlength="6" 
                            inputmode="numeric" 
                            pattern="\d{6}"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">密碼</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password"
                            class="form-control" 
                            placeholder="請輸入密碼" 
                            inputmode="text"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> 登入
                    </button>
                </form>

                <div id="loginResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: var(--gray); margin-bottom: 12px;">還沒有帳號？</p>
                    <button class="btn btn-secondary" onclick="switchToRegister()">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </button>

                    <button class="btn btn-info" onclick="showAdminModal()" style="margin-top: 10px;">
                        <i class="fas fa-user-shield"></i> 管理員登入
                    </button>
                </div>
            </div>

            <!-- ========== 註冊區塊 ========== -->
            <div id="registerSection" class="card" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-user-plus"></i> 申請帳號
                    </h2>
                </div>

                <form id="registerForm" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="registerStudentId">學號</label>
                        <input 
                            type="text" 
                            id="registerStudentId" 
                            name="username"
                            class="form-control" 
                            placeholder="請輸入6位數學號" 
                            maxlength="6" 
                            inputmode="numeric" 
                            pattern="\d{6}"
                            autocomplete="username"
                            required
                        >
                        <div class="form-text">範例：123456</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerName">姓名</label>
                        <input 
                            type="text" 
                            id="registerName" 
                            name="name"
                            class="form-control" 
                            placeholder="請輸入真實姓名" 
                            maxlength="20"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerPassword">密碼</label>
                        <input 
                            type="password" 
                            id="registerPassword" 
                            name="password"
                            class="form-control" 
                            placeholder="請設定密碼（至少 6 位）" 
                            minlength="6"
                            inputmode="text"
                            autocomplete="new-password"
                            required
                        >
                        <div class="form-text">密碼至少 6 位，註冊後可用學號和密碼登入</div>
                    </div>

                    <div class="message info" style="margin-bottom: 15px;">
                        <i class="fas fa-info-circle"></i> 申請成功後餘額為 0 元。
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check-circle"></i> 送出申請
                    </button>
                </form>

                <div id="registerResult" style="margin-top: 15px;"></div>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee;">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // 1. 註冊 Service Worker，並強制不使用 HTTP 快取讀取 SW 腳本
          navigator.serviceWorker.register('service-worker.js', {
            scope: '/BHG_order_system/',
            updateViaCache: 'none' // 關鍵：永遠去伺服器檢查 service-worker.js 是否有更新
          })
            .then(function(registration) {
              console.log('✅ Service Worker 註冊成功');

              // 2. 監聽是否有新的 Service Worker 正在安裝
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('🔄 發現新版本的 Service Worker');

                newWorker.addEventListener('statechange', () => {
                  // 當新 SW 安裝完成，且已經有舊 SW 在控制頁面時
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('📥 新版本已就緒，發送 SKIP_WAITING 指令...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function(error) {
              console.warn('⚠️ Service Worker 註冊失敗:', error);
            });

          // 3. 監聽 Service Worker 控制權變更（代表新 SW 已經接管）
          let refreshing;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            console.log('🔄 Service Worker 已更新，自動重新整理頁面...');
            window.location.reload(); // 自動重整，載入最新畫面
          });
        });
      }
    </script>
