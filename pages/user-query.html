<!-- ==================== 使用者查詢頁面 ==================== -->
<div id="page-user-query" class="page-container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i class="fas fa-search-dollar"></i> 查詢餘額
            </h2>
        </div>

        <div class="balance-display" style="margin-top: 0;">
            <div>目前餘額</div>
            <div class="balance-amount" id="balanceDisplay">-</div>
            <div id="userNameDisplay"></div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="queryStudentId" class="form-control" placeholder="請輸入學號" style="flex: 1; padding: 10px 12px;">
            <button type="button" class="btn btn-primary" onclick="queryUserInfo()" style="width: auto; flex-shrink: 0; padding: 10px 16px;">查詢</button>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2 class="card-title">
                <i class="fas fa-history"></i> 近期交易紀錄
            </h2>

            <div class="table-container">
                <table class="table" id="transactionTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>類型</th>
                            <th>品項</th>
                            <th>金額</th>
                        </tr>
                    </thead>
                    <tbody id="transactionBody">
                        <tr><td colspan="4" style="text-align: center;">請輸入學號查詢</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
