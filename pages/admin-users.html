<!-- ==================== 管理員用戶管理頁面 ==================== -->
<div id="page-admin-users" class="page-container">

  <div class="card">
    <h2 class="card-title">
      <i class="fas fa-edit"></i> 更改學號
    </h2>

    <div class="message warning" style="margin-bottom: 16px;">
      <i class="fas fa-exclamation-triangle"></i>
      <strong>注意：</strong>此操作將會變更使用者在所有系統中的學號，包括交易紀錄和訂單歷史。
    </div>

    <div class="form-group">
      <label class="form-label">原學號</label>
      <input type="text" id="changeOldUserId" class="form-control"
            placeholder="請輸入原6位數學號" maxlength="6" required>
    </div>

    <div class="form-group">
      <label class="form-label">新學號</label>
      <input type="text" id="changeNewUserId" class="form-control"
            placeholder="請輸入新6位數學號" maxlength="6" required>
      <span class="form-text">新學號不能與現有學號重複</span>
    </div>

    <button type="button" class="btn btn-warning" onclick="confirmChangeUserId()">
      <i class="fas fa-sync-alt"></i> 確認更改學號
    </button>

    <div id="changeUserIdResult" style="margin-top: 16px;"></div>
  </div>

</div>
