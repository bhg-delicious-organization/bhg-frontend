<!-- ==================== 管理員訂單頁面 ==================== -->
<div id="page-admin-orders" class="page-container">

    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-clipboard-list"></i> 訂單紀錄
            <span id="orderCountBadge" class="badge badge-info" style="margin-left: 10px;">載入中</span>
        </h2>

        <!-- 日期篩選 -->
        <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: flex-end;">
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 0.8rem; color: var(--gray);">開始日期</label>
                <input type="date" id="orderStartDate" class="form-control" style="padding: 8px;">
            </div>
            <div style="flex: 1; min-width: 120px;">
                <label style="font-size: 0.8rem; color: var(--gray);">結束日期</label>
                <input type="date" id="orderEndDate" class="form-control" style="padding: 8px;">
            </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="loadTodayOrders(event)" style="flex: 1; min-width: 100px;">
                <i class="fas fa-search"></i> 查詢
            </button>
            <button class="btn btn-secondary" onclick="resetOrderDateFilter()" style="flex: 1; min-width: 100px;">
                <i class="fas fa-times"></i> 清除
            </button>
        </div>

        <div class="form-text" style="margin-bottom: 15px;">
            📌 日期範圍最多 7 天，不填則顯示最近 20 筆
        </div>

        <div id="ordersDisplay">
            <div class="loading"><div class="spinner"></div>載入中...</div>
        </div>
    </div>

</div>
