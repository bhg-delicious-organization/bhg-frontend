<div id="page-user-home" class="page-container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i class="fas fa-wallet"></i> 我的錢包
            </h2>
        </div>

        <div class="balance-display" style="margin-top: 0;">
            <div>目前餘額</div>
            <div class="balance-amount" id="balanceDisplay">-</div>
            <div id="userNameDisplay"></div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2 class="card-title">
                <i class="fas fa-history"></i> 近期交易紀錄
            </h2>

            <div class="table-container">
                <table class="table" id="transactionTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>類型</th>
                            <th>品項</th>
                            <th>金額</th>
                        </tr>
                    </thead>
                    <tbody id="transactionBody">
                        <tr><td colspan="4" style="text-align: center;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="transactionsLoadMore" style="display: none; margin-top: 12px;">
                <button class="btn btn-secondary" onclick="loadMoreTransactions(event)">
                    <i class="fas fa-chevron-down"></i> 載入更多
                </button>
            </div>
        </div>
    </div>
</div>
