<!-- ==================== 使用者帳號頁面 ==================== -->
<div id="page-user-account" class="page-container">
    <div id="accountLoggedIn" class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i class="fas fa-user-circle"></i> 我的帳號
            </h2>
            <button class="btn btn-info" onclick="startTutorial('account')" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.8rem;">
                <i class="fas fa-graduation-cap"></i> 教學
            </button>
        </div>

        <div class="form-group">
            <label class="form-label">學號</label>
            <div class="form-control" id="accountStudentId" style="background: #f5f5f5;">載入中...</div>
        </div>

        <div class="form-group">
            <label class="form-label">姓名</label>
            <div class="form-control" id="accountUserName" style="background: #f5f5f5;">載入中...</div>
        </div>

        <div class="form-group">
            <label class="form-label">總消費金額</label>
            <div class="form-control" id="accountTotalSpent" style="background: #f5f5f5;">載入中...</div>
        </div>

        <div style="margin: 20px 0; border-top: 1px solid #eee;"></div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="navigateTo('user-changepwd')" style="flex: 1;">
                <i class="fas fa-key"></i> 修改密碼
            </button>
            <button class="btn btn-secondary" id="accountLogoutBtn" onclick="logoutFromAccount()" style="flex: 1;">
                <i class="fas fa-sign-out-alt"></i> 登出
            </button>
        </div>
    </div>
</div>
