<!-- ==================== 管理員餐廳頁面 ==================== -->
<div id="page-admin-restaurant" class="page-container">

    <!-- 決定餐廳區塊 -->
    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-store"></i> 決定餐廳
        </h2>

        <div id="todayRestaurantStatus" style="margin-bottom: 15px; padding: 15px; background: #f0f9ff; border-radius: var(--radius); border-left: 4px solid #4f46e5;">
            <span id="todayRestaurantText">載入中...</span>
        </div>

        <div id="restaurantSelectContainer" style="display: none;">
            <div class="form-group">
                <label class="form-label">餐廳</label>
                <select id="restaurantSelect" class="form-control">
                    <option value="">請選擇餐廳</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">點餐截止時間</label>
                <select id="orderEndTimeSelect" class="form-control">
                    <option value="900">09:00</option>
                    <option value="930">09:30</option>
                    <option value="1000" selected>10:00（預設）</option>
                    <option value="1030">10:30</option>
                    <option value="1100">11:00</option>
                    <option value="1130">11:30</option>
                    <option value="1200">12:00</option>
                    <option value="2359">🌐 全天候（測試用，23:59 截止）</option>
                </select>
                <div class="form-text">使用者需在此時間前完成點餐</div>
            </div>

            <button class="btn btn-primary" onclick="setTodayRestaurant(event)">
                <i class="fas fa-check"></i> 確認設定
            </button>
        </div>

        <div id="restaurantResult" style="margin-top: 15px;"></div>
    </div>

    <!-- 截止訂餐區塊 -->
    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-cut"></i> 截止訂餐
        </h2>
        <button class="btn btn-warning" onclick="cutOffOrder()">
            <i class="fas fa-scissors"></i> 截止訂餐並扣款
        </button>
        <div id="cutOffResult" style="margin-top: 15px;"></div>
    </div>

    <!-- 餐點統計區塊 -->
    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-chart-bar"></i> 餐點統計
        </h2>

        <p style="font-size: 0.85rem; color: var(--gray); margin-bottom: 8px;">🔍 檢視</p>
        <div class="button-group" style="margin-bottom: 12px;">
            <button class="btn btn-primary" onclick="showTodayRestaurantStats(event)">
                <i class="fas fa-utensils"></i> 今日餐廳
            </button>
        </div>

        <div id="mealStatsResult" style="margin-bottom: 12px;"></div>

        <p style="font-size: 0.85rem; color: var(--gray); margin-bottom: 8px;">📋 複製餐點</p>
        <div class="button-group">
            <button class="btn btn-secondary" onclick="copyRestaurantStatsList(event)">
                <i class="fas fa-clipboard"></i> 今日餐廳
            </button>
        </div>
    </div>

</div>
