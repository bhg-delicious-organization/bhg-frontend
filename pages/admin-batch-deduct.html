<!-- ==================== 管理員扣款頁面 ==================== -->
<div id="page-admin-batch-deduct" class="page-container">

    <!-- 單筆扣款區塊 -->
    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-minus-circle"></i> 單筆扣款
        </h2>

        <div class="form-group">
            <label class="form-label">被扣款者學號</label>
            <input type="text" id="deductStudentId" class="form-control" placeholder="請輸入學號" maxlength="6">
        </div>

        <div class="form-group">
            <label class="form-label">扣款金額</label>
            <input type="number" id="deductAmount" class="form-control" placeholder="請輸入金額">
        </div>

        <button class="btn btn-danger" onclick="deductBalance(event)">
            <i class="fas fa-minus-circle"></i> 確認扣款
        </button>

        <div id="deductResult" style="margin-top: 15px;"></div>
    </div>

    <!-- 批量扣款區塊（依分類） -->
    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-layer-group"></i> 批量扣款（依分類）
        </h2>

        <div class="form-group">
            <label class="form-label">今日餐廳</label>
            <div id="batchRestaurantName" style="padding: 10px; background: #f0f9ff; border-radius: 8px; border-left: 4px solid var(--secondary);">
                載入中...
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">選擇分類</label>
            <select id="batchCategorySelect" class="form-control" onchange="showCategoryOrderers()">
                <option value="">請先選擇分類</option>
            </select>
        </div>

        <div id="batchOrderersList" style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; max-height: 200px; overflow-y: auto;">
            <!-- 會顯示訂購者清單 -->
        </div>

        <div class="form-group">
            <label class="form-label">每個餐點扣款金額</label>
            <input type="number" id="batchDeductAmount" class="form-control" placeholder="請輸入金額">
            <div class="form-text">例如輸入 10，則每個訂購者會扣 10 × 訂購數量</div>
        </div>

        <button class="btn btn-warning" onclick="confirmBatchDeductByCategory()">
            <i class="fas fa-calculator"></i> 執行批量扣款
        </button>

        <div id="batchDeductResult" style="margin-top: 15px;"></div>
    </div>

</div>
