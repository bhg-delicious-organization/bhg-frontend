<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>UI 模組測試</h1>

  <button class="btn btn-primary" onclick="testUI_showMessage()">測試 showMessage</button>
  <button class="btn btn-success" onclick="testUI_showConfirm()">測試 showConfirm</button>
  <button class="btn btn-warning" onclick="testUI_buttonLoading()" id="testBtn">測試 setButtonLoading</button>

  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:100px;"></pre>

  <!-- 測試用的模態窗 -->
  <div id="messageModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="messageTitle">訊息</h3>
        <button class="close-btn" onclick="closeMessageModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="messageContent"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeMessageModal()">確定</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="confirmTitle">確認</h3>
        <button class="close-btn" onclick="confirmNo()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirmContent"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="confirmYes()">確定</button>
        <button class="btn btn-secondary" onclick="confirmNo()">取消</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script>
    function testUI_showMessage() {
      UI.showMessage('✅ 測試成功', '這是訊息模態窗', 'success');
    }

    function testUI_showConfirm() {
      UI.showConfirm(
        '⚠️ 確認動作',
        '你確定要執行嗎？',
        function() {
          document.getElementById('result').textContent = '✅ 你按了「確定」';
        },
        function() {
          document.getElementById('result').textContent = '❌ 你按了「取消」';
        }
      );
    }

    function testUI_buttonLoading() {
      const btn = document.getElementById('testBtn');
      setButtonLoading(btn, true);

      setTimeout(() => {
        setButtonLoading(btn, false);
        document.getElementById('result').textContent = '✅ 按鈕載入 2 秒後恢復';
      }, 2000);
    }
  </script>
</body>
</html>
