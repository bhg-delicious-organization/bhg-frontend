<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>api.js 測試</title>
</head>
<body>
  <h1>api.js + state.js 測試</h1>
  <button onclick="testGetSystemInfo()">測試 getSystemInfo</button>
  <button onclick="testGetTimeLimits()">測試 getTimeLimits</button>
  <button onclick="testAppState()">測試 AppState</button>
  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script>
    async function testGetSystemInfo() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '測試中...';
      const result = await callApi('getSystemInfo', {});
      resultEl.textContent = JSON.stringify(result, null, 2);
    }

    async function testGetTimeLimits() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '測試中...';
      const result = await callApi('getTimeLimits', {});
      resultEl.textContent = JSON.stringify(result, null, 2);
    }

    function testAppState() {
      const resultEl = document.getElementById('result');

      // 測試 1：初始化
      AppState.setCurrentStudentId('123456');
      AppState.setCurrentRestaurantName('測試餐廳');
      AppState.setAdmin(true, 'test-token', 'test-csrf');

      // 測試 2：讀取
      const snapshot = AppState.getSnapshot();

      // 測試 3：訂閱
      let notifyLog = [];
      const unsubscribe = AppState.subscribe('studentId', (data) => {
        notifyLog.push(`studentId 變更: ${data.old} → ${data.new}`);
      });

      AppState.setCurrentStudentId('654321');
      unsubscribe();

      // 清理（避免影響其他測試）
      AppState.logout();

      resultEl.textContent = JSON.stringify({
        snapshot: snapshot,
        notifyLog: notifyLog,
        cleanedUp: AppState.getSnapshot()
      }, null, 2);
    }
  </script>
</body>
</html>
