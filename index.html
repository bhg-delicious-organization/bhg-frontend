<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 測試</title>
</head>
<body>
  <h1>api.js 測試</h1>
  <button onclick="testGetSystemInfo()">測試 getSystemInfo</button>
  <button onclick="testGetTimeLimits()">測試 getTimeLimits</button>
  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <script src="api.js"></script>
  <script>
    async function testGetSystemInfo() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '測試中...';

      const result = await callApi('getSystemInfo', {});
      resultEl.textContent = JSON.stringify(result, null, 2);
    }

    async function testGetTimeLimits() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '測試中...';

      const result = await callApi('getTimeLimits', {});
      resultEl.textContent = JSON.stringify(result, null, 2);
    }
  </script>
</body>
</html>
