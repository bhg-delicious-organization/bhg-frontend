<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>測試 GitHub Pages</title>
</head>
<body>
  <h1>GitHub Pages 測試成功</h1>
  <p>網址：<span id="url"></span></p>
  <button onclick="testFetch()">測試 fetch GAS</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('url').textContent = window.location.href;

    async function testFetch() {
      const GAS_URL = 'https://script.google.com/macros/s/你的部署ID/exec';
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'getSystemInfo',
            data: {},
            origin: window.location.origin
          }),
          redirect: 'follow'
        });
        const result = await response.json();
        document.getElementById('result').textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        document.getElementById('result').textContent = '錯誤：' + error.message;
      }
    }
  </script>
</body>
</html>
