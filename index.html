<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>navigation.js 測試</h1>

  <button class="btn btn-primary" onclick="testSmartHome()">測試 getSmartHomePage</button>
  <button class="btn btn-success" onclick="testNavigation()">測試 navigateTo</button>
  <button class="btn btn-warning" onclick="testAdminMode()">測試管理員模式切換</button>

  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <!-- 測試用的頁面容器 -->
  <div id="pageContent">
    <div id="page-user-query" class="page-container">
      <h2>查詢頁（測試用）</h2>
      <p>這是 user-query 頁面</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/time.js"></script>
  <script src="js/core/common.js"></script>
  <script src="js/core/navigation.js"></script>
  <script>
    function testSmartHome() {
      const resultEl = document.getElementById('result');

      // 情境 1：未登入、非管理員模式
      AppState.logout();
      const case1 = getSmartHomePage();

      // 情境 2：已登入學號、非管理員模式
      AppState.setCurrentStudentId('123456');
      const case2 = getSmartHomePage();

      // 情境 3：管理員模式、非管理時間
      AppState.setAdmin(true, 'test-token');
      AppState.setAdminMode(true);
      const case3 = getSmartHomePage();

      // 清理
      AppState.logout();

      resultEl.textContent = JSON.stringify({
        '現在時間': getCurrentTimeNumber(),
        '情境 1 (未登入)': case1,
        '情境 2 (已登入學號)': case2,
        '情境 3 (管理員模式)': case3
      }, null, 2);
    }

    function testNavigation() {
      const resultEl = document.getElementById('result');

      AppState.setCurrentStudentId('123456');
      navigateTo('user-query');

      setTimeout(() => {
        resultEl.textContent = JSON.stringify({
          '當前頁面': AppState.currentPage(),
          'user-query 有 active class': document.getElementById('page-user-query').classList.contains('active')
        }, null, 2);
      }, 500);
    }

    function testAdminMode() {
      const resultEl = document.getElementById('result');

      // 模擬登入管理員
      AppState.setAdmin(true, 'test-token');
      switchToAdminMode();

      setTimeout(() => {
        resultEl.textContent = JSON.stringify({
          'isAdmin': AppState.isAdmin(),
          'isAdminMode': AppState.isAdminMode(),
          '當前頁面': AppState.currentPage()
        }, null, 2);
      }, 500);
    }
  </script>
</body>
</html>
