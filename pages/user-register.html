<!-- ==================== 申請帳號頁面 ==================== -->
<div id="page-user-register" class="page-container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i class="fas fa-user-plus"></i> 申請帳號
            </h2>
        </div>

        <div class="form-group">
            <label class="form-label">學號</label>
            <input type="text" id="registerStudentId" class="form-control" placeholder="請輸入6位數學號" maxlength="6">
            <div class="form-text">範例：123456</div>
        </div>

        <div class="form-group">
            <label class="form-label">姓名</label>
            <input type="text" id="registerName" class="form-control" placeholder="請輸入真實姓名">
        </div>

        <div class="message info" style="margin-bottom: 15px;">
            <i class="fas fa-info-circle"></i> 申請成功後餘額為 0 元。
        </div>

        <button class="btn btn-success" onclick="registerUser()">
            <i class="fas fa-check-circle"></i> 送出申請
        </button>

        <div id="registerResult" style="margin-top: 15px;"></div>
    </div>
</div>
