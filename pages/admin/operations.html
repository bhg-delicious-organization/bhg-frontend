<div id="page-admin-operations" class="page-container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i class="fas fa-store"></i> 營運中心
            </h2>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="ops-restaurant">設定餐廳</button>
            <button class="tab-btn" data-tab="ops-cutoff">截止訂餐</button>
            <button class="tab-btn" data-tab="ops-stats">餐點統計</button>
        </div>

        <div id="ops-restaurant" class="tab-content active">
            <div id="todayRestaurantStatus" style="margin-bottom: 15px; padding: 15px; background: #f0f9ff; border-radius: var(--radius); border-left: 4px solid #4f46e5;">
                <span id="todayRestaurantText">載入中...</span>
            </div>

            <div id="restaurantSelectContainer" style="display: none;">
                <div class="form-group">
                    <label class="form-label">餐廳</label>
                    <select id="restaurantSelect" class="form-control">
                        <option value="">請選擇餐廳</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">點餐截止時間</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;">
                        <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 60px;" onclick="setEndTimeQuick(930)">09:30</button>
                        <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 60px;" onclick="setEndTimeQuick(1000)">10:00</button>
                        <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 60px;" onclick="setEndTimeQuick(1200)">12:00</button>
                        <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 60px;" onclick="setEndTimeQuick(1800)">18:00</button>
                        <button type="button" class="btn btn-warning" style="flex: 1; min-width: 60px;" onclick="setEndTimeQuick(2400)">🌐 全天候</button>
                    </div>
                    <input type="number" id="orderEndTimeInput" class="form-control" placeholder="輸入 HHMM（例如 1000）" value="1000" min="0" max="2400">
                    <div class="form-text">格式 HHMM（0930 = 09:30，2400 = 全天候）</div>
                </div>
                <button class="btn btn-primary" onclick="setTodayRestaurant(event)">
                    <i class="fas fa-check"></i> 確認設定
                </button>
            </div>
            <div id="restaurantResult" style="margin-top: 15px;"></div>
        </div>

        <div id="ops-cutoff" class="tab-content">
            <div class="message warning" style="margin-bottom: 15px;">
                <i class="fas fa-exclamation-triangle"></i> 此操作將對所有訂購者進行扣款，且無法復原。
            </div>
            <button class="btn btn-danger" onclick="cutOffOrder()">
                <i class="fas fa-scissors"></i> 確認截止訂餐並扣款
            </button>
            <div id="cutOffResult" style="margin-top: 15px;"></div>
        </div>

        <div id="ops-stats" class="tab-content">
            <div class="button-group" style="margin-bottom: 15px;">
                <button class="btn btn-primary" onclick="showTodayRestaurantStats(event)">
                    <i class="fas fa-chart-bar"></i> 載入今日統計
                </button>
                <button class="btn btn-secondary" onclick="copyRestaurantStatsList(event)">
                    <i class="fas fa-clipboard"></i> 複製統計名單
                </button>
            </div>
            <div id="mealStatsResult"></div>
        </div>
    </div>
</div>
