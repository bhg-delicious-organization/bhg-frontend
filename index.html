<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>common.js 測試</h1>

  <button class="btn btn-primary" onclick="testCommon()">測試 common.js</button>
  <button class="btn btn-success" onclick="testEscapeHtml_XSS()">測試 escapeHtml (XSS)</button>

  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/time.js"></script>
  <script src="js/core/common.js"></script>
  <script>
    function testCommon() {
      const resultEl = document.getElementById('result');

      AppState.setAdmin(true, 'test-token-123', 'test-csrf-456');
      const adminToken = getAdminToken();
      const csrfToken = getCsrfToken();
      AppState.logout();

      const result = {
        '管理員 Token (設定後取得)': adminToken,
        'CSRF Token (設定後取得)': csrfToken,
        '管理員登出後 Token': getAdminToken(),
        '管理員登出後 CSRF': getCsrfToken(),
        'typeof escapeHtml': typeof escapeHtml,
        'typeof getAdminToken': typeof getAdminToken,
        'typeof getCsrfToken': typeof getCsrfToken
      };

      resultEl.textContent = JSON.stringify(result, null, 2);
    }

    function testEscapeHtml_XSS() {
      const resultEl = document.getElementById('result');

      // 用 String.fromCharCode 避開 < 和 >
      const lt = String.fromCharCode(60);  // <
      const gt = String.fromCharCode(62);  // >

      const testCases = {
        '普通文字': 'Hello World',
        'HTML 標籤': lt + 'script' + gt + 'alert("xss")' + lt + '/script' + gt,
        '屬性注入': '" onmouseover="alert(1)',
        '單引號': "It's a test",
        '和號': 'A & B',
        '中文+特殊符號': '王小明' + lt + 'script' + gt + 'alert(1)' + lt + '/script' + gt,
        'null': null,
        'undefined': undefined,
        '數字': 12345
      };

      const results = {};
      for (const [key, value] of Object.entries(testCases)) {
        results[key] = {
          '原始': value,
          '轉義後': escapeHtml(value)
        };
      }

      resultEl.textContent = JSON.stringify(results, null, 2);
    }
  </script>
</body>
</html>
