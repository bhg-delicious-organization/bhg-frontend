<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>preload.js 測試</h1>

  <button class="btn btn-primary" onclick="testPreloadTimeLimits()">測試 preloadTimeLimits</button>
  <button class="btn btn-success" onclick="testPreloadRestaurant()">測試 preloadTodayRestaurant</button>
  <button class="btn btn-warning" onclick="testRunPreload()">測試完整 runPreload</button>

  <pre id="result" style="background:#f0f0f0; padding:20px; margin-top:20px; min-height:200px;"></pre>

  <script src="api.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/time.js"></script>
  <script src="js/core/common.js"></script>
  <script src="js/core/navigation.js"></script>
  <script src="js/core/preload.js"></script>
  <script>
    async function testPreloadTimeLimits() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '載入中...';

      await preloadTimeLimits();

      resultEl.textContent = JSON.stringify({
        'TIME 物件': TIME,
        '預載入成功': true
      }, null, 2);
    }

    async function testPreloadRestaurant() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '載入中...';

      await preloadTodayRestaurant();

      resultEl.textContent = JSON.stringify({
        'AppState.currentRestaurantName()': AppState.currentRestaurantName(),
        '預載入成功': true
      }, null, 2);
    }

    async function testRunPreload() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '載入中...';

      await runPreload();

      resultEl.textContent = JSON.stringify({
        'TIME 物件': TIME,
        '今日餐廳': AppState.currentRestaurantName(),
        '當前學號': AppState.currentStudentId(),
        '預載入完成': true
      }, null, 2);
    }
  </script>
</body>
</html>
